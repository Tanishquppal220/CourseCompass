[project]
name = "backend"
version = "0.1.0"
description = "CourseCompass Backend API"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "torch>=2.2.0",
  "fastapi[standard]>=0.141.1",
  "sqlalchemy>=2.0.0",
  "psycopg2-binary>=2.9.9",
  "pgvector>=0.2.0",
  "pydantic-settings>=2.0.0",
  "alembic>=1.13.0",
  "sentence-transformers>=6.0.1",
  "python-dotenv>=1.2.3",
  "langchain>=1.3.18",
  "langchain-google-genai>=4.4.0",
  "langchain-text-splitters>=1.1.2",
  "langchain-aws>=1.7.5",
  "langgraph>=1.2.11",
  "langchain-community>=0.4.2",
  "python-jose[cryptography]>=3.5.0",
  "passlib[bcrypt]>=1.7.4",
  "psycopg[binary]>=3.3.6",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
  "python-docx>=1.2.0",
  "ruff>=0.16.6",
  "pymupdf>=1.28.2",
  "pymupdf-layout>=1.28.2",
  "pymupdf4llm>=1.28.2",
]

[tool.ruff.lint]
extend-select = ["I"]
